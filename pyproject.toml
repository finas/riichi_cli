[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riichi-mahjong-cli"
version = "1.2.4"
description = "Terminal CLI Japanese Riichi Mahjong game"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
riichi = "mahjong.cli:main"

[tool.setuptools.packages.find]
include = ["mahjong*", "data*", "engines*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
data = ["**/*"]
engines = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
